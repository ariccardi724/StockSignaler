name: End-of-day signal scan

# Runs Mon-Fri at 4:15pm ET. GitHub Actions cron is UTC only and cannot
# follow daylight saving, so this uses 21:15 UTC: 4:15pm EST in winter,
# 5:15pm EDT in summer — after the 4:00pm close in both cases.
on:
  schedule:
    - cron: '15 21 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run EOD scan
        run: python3 scripts/eod_scan.py
      - name: Commit scan results
        run: |
          git config user.name "buy-signal-scan"
          git config user.email "buy-signal-scan@users.noreply.github.com"
          git add docs/scan-results.json
          git diff --cached --quiet || git commit -m "EOD scan $(date -u +%Y-%m-%d)"
          git push
